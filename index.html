<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0">
<title>Nandi Jukar — Eye Drop Tracker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;700;800&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&family=Noto+Sans+Devanagari:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#FAF6EC;
    --card:#FFFFFF;
    --card-border:#E3DCC8;
    --ink:#12162B;
    --ink-soft:#4A5164;
    --navy:#12163A;
    --navy-2:#1B2050;
    --navy-ink:#F5F4FF;
    --accent:#5B4CFF;
    --accent-soft:#EEECFF;
    --accent-blue:#2F6BFF;
    --accent-blue-soft:#E8EFFF;
    --success:#177A52;
    --success-soft:#E1F3EA;
    --amber:#9C6B0A;
    --amber-soft:#FCF0D8;
    --danger:#B23A2E;
    --pending:#8791A6;
    --pending-track:#E8E6F0;
    --shadow: 0 1px 2px rgba(18,22,43,0.06), 0 10px 28px rgba(18,22,43,0.08);
    --radius-lg:24px; --radius-md:18px; --radius-sm:12px;
  }
  [data-theme="dark"]{
    --bg:#0A0D1B;
    --card:#141A32;
    --card-border:#272E4E;
    --ink:#F1F1FB;
    --ink-soft:#AEB4CE;
    --navy:#080A16;
    --navy-2:#11142A;
    --navy-ink:#F1F1FB;
    --accent:#8C7BFF;
    --accent-soft:#1E2144;
    --accent-blue:#5B8CFF;
    --accent-blue-soft:#151E38;
    --success:#3FD08A;
    --success-soft:#12281F;
    --amber:#E8B24B;
    --amber-soft:#2A2313;
    --danger:#EE8C7E;
    --pending:#6B7390;
    --pending-track:#1C2340;
    --shadow: 0 1px 2px rgba(0,0,0,0.35), 0 10px 28px rgba(0,0,0,0.45);
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg); color:var(--ink); font-family:'Inter',system-ui,-apple-system,sans-serif;
    -webkit-font-smoothing:antialiased; min-height:100vh; transition:background .25s ease, color .25s ease;
    padding-bottom:96px; touch-action:manipulation;
  }
  body.mr{ font-family:'Noto Sans Devanagari','Inter',system-ui,sans-serif; }
  .display{ font-family:'Manrope',sans-serif; }
  body.mr .display{ font-family:'Noto Sans Devanagari','Manrope',sans-serif; }
  .mono{ font-family:'IBM Plex Mono',monospace; }
  .wrap{ max-width:540px; margin:0 auto; padding:18px 16px 8px; }

  /* Topbar */
  .topbar{ display:flex; align-items:flex-start; justify-content:space-between; gap:12px; margin-bottom:14px; }
  .brand-name{ font-size:12.5px; font-weight:800; letter-spacing:0.14em; color:var(--ink-soft); text-transform:uppercase; }
  .brand-title{ font-size:20px; font-weight:800; margin-top:2px; }
  .brand-date{ font-size:12.5px; color:var(--ink-soft); font-weight:700; margin-top:6px; letter-spacing:.03em; }
  .icon-row{ display:flex; gap:8px; flex-shrink:0; }
  .icon-btn{
    width:42px; height:42px; border-radius:13px; border:1.5px solid var(--card-border); background:var(--card);
    display:flex; align-items:center; justify-content:center; cursor:pointer; color:var(--ink); box-shadow:var(--shadow);
  }
  .icon-btn svg{ width:19px; height:19px; }
  .icon-btn.on{ background:var(--accent); border-color:var(--accent); color:#fff; }
  .lang-btn{ font-size:12px; font-weight:800; width:auto; padding:0 12px; }

  /* Date nav */
  .date-nav{ display:flex; align-items:stretch; gap:8px; margin-bottom:12px; }
  .date-arrow-btn{
    width:44px; border-radius:14px; border:1.5px solid var(--card-border); background:var(--card);
    display:flex; align-items:center; justify-content:center; font-size:22px; color:var(--ink-soft);
    cursor:pointer; box-shadow:var(--shadow); flex-shrink:0; user-select:none;
  }
  .date-center{ flex:1; position:relative; background:var(--card); border:1.5px solid var(--card-border); border-radius:14px; padding:9px 14px; text-align:center; box-shadow:var(--shadow); overflow:hidden; }
  .date-center .lbl{ font-size:9.5px; color:var(--ink-soft); text-transform:uppercase; font-weight:800; letter-spacing:.09em; }
  .date-center .val{ font-size:14.5px; font-weight:800; margin-top:2px; }
  .date-center input[type=date]{ position:absolute; inset:0; opacity:0; width:100%; height:100%; border:0; margin:0; padding:0; cursor:pointer; }
  .today-chip-btn{ display:inline-block; font-size:11.5px; font-weight:800; color:var(--accent); background:var(--accent-soft); padding:9px 14px; border-radius:12px; margin-bottom:12px; cursor:pointer; user-select:none; }

  /* Next dose */
  .next-dose-card{ background:linear-gradient(135deg, var(--navy), var(--navy-2)); border-radius:var(--radius-lg); padding:18px 20px; color:var(--navy-ink); box-shadow:var(--shadow); margin-bottom:14px; }
  .next-dose-label{ font-size:11px; font-weight:800; letter-spacing:.14em; text-transform:uppercase; opacity:.65; margin-bottom:10px; }
  .nd-row{ display:flex; justify-content:space-between; align-items:center; font-size:13.5px; padding:5px 0; opacity:.92; }
  .nd-row b{ font-size:15px; font-weight:800; }
  .next-dose-complete{ font-size:14.5px; font-weight:700; color:#7FE8B8; }

  /* Overall */
  .overall-card{ background:var(--card); border:1.5px solid var(--card-border); border-radius:var(--radius-lg); padding:18px 20px; box-shadow:var(--shadow); margin-bottom:20px; }
  .overall-label{ font-size:11px; font-weight:800; letter-spacing:.12em; text-transform:uppercase; color:var(--ink-soft); }
  .overall-num{ font-size:20px; font-weight:800; margin-top:4px; }
  .bar-track{ height:9px; border-radius:99px; background:var(--pending-track); margin-top:10px; overflow:hidden; }
  .bar-fill{ height:100%; border-radius:99px; background:var(--accent); transition:width .35s ease; }

  /* Tabs */
  .tabs{ display:flex; gap:6px; margin-bottom:16px; background:var(--card); border:1.5px solid var(--card-border); border-radius:14px; padding:4px; }
  .tab{ flex:1; text-align:center; padding:10px 0; border-radius:11px; font-size:13px; font-weight:700; color:var(--ink-soft); cursor:pointer; user-select:none; }
  .tab.active{ background:var(--navy); color:var(--navy-ink); }

  /* Eye section */
  .eye-section{ margin-bottom:26px; }
  .eye-header{ background:var(--navy); border-radius:22px; padding:18px 20px; color:var(--navy-ink); margin-bottom:10px; box-shadow:var(--shadow); }
  .eye-header-top{ display:flex; align-items:center; gap:12px; }
  .eye-emoji{ font-size:28px; line-height:1; }
  .eye-title{ font-size:15px; font-weight:800; letter-spacing:.1em; text-transform:uppercase; }
  .eye-day{ font-size:23px; font-weight:800; margin-top:3px; color:var(--eye-color); }
  .eye-dayof{ margin-top:10px; font-size:11.5px; font-weight:700; opacity:.68; letter-spacing:.02em; }
  .eye-progress{ background:var(--card); border:1.5px solid var(--card-border); border-radius:18px; padding:14px 16px; box-shadow:var(--shadow); margin-bottom:12px; }
  .eye-progress-label{ font-size:11px; font-weight:800; letter-spacing:.08em; text-transform:uppercase; color:var(--ink-soft); }
  .eye-progress-num{ font-size:16.5px; font-weight:800; margin-top:4px; }
  .eye-progress .bar-fill{ background:var(--eye-color); }

  /* Taper */
  .taper-card{ background:var(--card); border:1.5px solid var(--card-border); border-radius:var(--radius-lg); padding:16px 18px; box-shadow:var(--shadow); margin-bottom:12px; }
  .taper-title{ font-size:11.5px; font-weight:800; letter-spacing:.08em; text-transform:uppercase; color:var(--ink-soft); margin-bottom:10px; }
  .taper-current{ font-size:15px; font-weight:700; margin-bottom:12px; }
  .taper-current span{ color:var(--amber); }
  .taper-stages{ display:flex; gap:6px; }
  .stage{ flex:1; text-align:center; padding:9px 4px; border-radius:12px; border:1.5px solid var(--pending-track); }
  .stage .days{ font-size:9.5px; color:var(--ink-soft); font-weight:700; }
  .stage .freq{ font-size:13px; font-weight:800; margin-top:3px; }
  .stage.current{ border-color:var(--amber); background:var(--amber-soft); }
  .stage.current .days{ color:var(--amber); }
  .stage.past{ opacity:.45; }

  /* Med card */
  .med-card{ background:var(--card); border:1.5px solid var(--card-border); border-radius:var(--radius-lg); padding:16px 16px 14px; box-shadow:var(--shadow); margin-bottom:12px; }
  .med-head{ display:flex; align-items:flex-start; justify-content:space-between; gap:10px; }
  .med-name{ font-size:15.5px; font-weight:800; }
  .med-sub{ font-size:12px; color:var(--ink-soft); margin-top:2px; line-height:1.4; }
  .med-freq-chip{ font-size:10.5px; font-weight:800; text-transform:uppercase; background:var(--eye-color); color:#fff; padding:4px 9px; border-radius:99px; white-space:nowrap; flex-shrink:0; opacity:.9; }

  .dose-line{ border:1.5px solid var(--pending-track); background:var(--bg); border-radius:16px; padding:12px 14px; margin-top:10px; }
  .dose-line-top{ display:flex; align-items:center; justify-content:space-between; gap:10px; }
  .dose-line-info .lbl{ font-weight:800; font-size:13px; }
  .dose-line-info .time{ font-size:11.5px; color:var(--ink-soft); font-family:'IBM Plex Mono',monospace; margin-top:2px; }
  .give-btn{ min-width:104px; text-align:center; padding:11px 14px; border-radius:14px; border:2px solid var(--pending); font-weight:800; font-size:12.5px; letter-spacing:.04em; text-transform:uppercase; cursor:pointer; color:var(--ink-soft); background:var(--card); display:flex; align-items:center; justify-content:center; gap:6px; }
  .give-btn.given{ background:var(--eye-color); border-color:var(--eye-color); color:#fff; }
  .give-btn .gicon svg{ width:14px; height:14px; }
  .give-btn:active{ transform:scale(0.96); }
  .given-at{ margin-top:8px; font-size:11.5px; color:var(--ink-soft); font-weight:600; }

  .all-done{ text-align:center; padding:24px 20px; color:var(--ink-soft); font-size:13.5px; background:var(--card); border:1.5px solid var(--card-border); border-radius:var(--radius-lg); box-shadow:var(--shadow); }

  /* History */
  .hist-filter-tabs{ display:flex; gap:6px; margin-bottom:14px; background:var(--card); border:1.5px solid var(--card-border); border-radius:14px; padding:4px; }
  .hf-tab{ flex:1; text-align:center; padding:9px 0; border-radius:11px; font-size:12px; font-weight:800; color:var(--ink-soft); cursor:pointer; user-select:none; }
  .hf-tab.active{ background:var(--eye-color, var(--navy)); color:#fff; }
  .hist-card{ background:var(--card); border:1.5px solid var(--card-border); border-radius:var(--radius-lg); padding:16px 18px; box-shadow:var(--shadow); margin-bottom:10px; }
  .hist-date{ font-weight:800; font-size:14.5px; margin-bottom:10px; }
  .hist-eye-block{ border-left:3px solid var(--eye-color); padding-left:12px; margin-bottom:10px; }
  .hist-eye-block:last-child{ margin-bottom:0; }
  .hist-eye-label{ font-size:11px; font-weight:800; letter-spacing:.08em; text-transform:uppercase; color:var(--eye-color); margin-bottom:4px; }
  .hist-row{ display:flex; justify-content:space-between; font-size:13px; padding:3px 0; color:var(--ink-soft); }
  .hist-row b{ color:var(--ink); font-weight:600; }
  .hist-row .ok{ color:var(--success); font-weight:700; }
  .hist-row .warn{ color:var(--danger); font-weight:700; }
  .empty-state{ text-align:center; padding:50px 20px; color:var(--ink-soft); font-size:14px; }

  /* Settings */
  .settings-card{ background:var(--card); border:1.5px solid var(--card-border); border-radius:var(--radius-lg); padding:16px 18px; box-shadow:var(--shadow); margin-bottom:12px; }
  .settings-card .med-name{ margin-bottom:10px; }
  .time-row{ display:flex; align-items:center; justify-content:space-between; gap:10px; padding:8px 0; border-top:1px solid var(--card-border); }
  .time-row:first-of-type{ border-top:none; }
  .time-row label{ font-size:13px; color:var(--ink-soft); font-weight:600; }
  .time-row input[type=time]{ font-family:'IBM Plex Mono',monospace; font-size:14px; border:1.5px solid var(--pending-track); background:var(--bg); color:var(--ink); border-radius:9px; padding:7px 8px; }
  .settings-note{ font-size:12px; color:var(--ink-soft); margin:2px 0 14px; line-height:1.55; }
  .section-title{ font-size:12px; font-weight:800; letter-spacing:.1em; text-transform:uppercase; color:var(--ink-soft); margin:22px 0 10px 2px; }

  /* Bottom nav */
  .bottom-nav{ position:fixed; bottom:0; left:0; right:0; background:var(--card); border-top:1.5px solid var(--card-border); display:flex; padding:8px 12px calc(10px + env(safe-area-inset-bottom)); gap:4px; z-index:10; }
  .nav-item{ flex:1; display:flex; flex-direction:column; align-items:center; gap:3px; padding:6px 0; border-radius:12px; color:var(--ink-soft); cursor:pointer; user-select:none; }
  .nav-item svg{ width:22px; height:22px; }
  .nav-item span{ font-size:10.5px; font-weight:700; }
  .nav-item.active{ color:var(--accent); }

  .patient-tag{ font-size:11px; color:var(--ink-soft); text-align:center; margin:20px 0 6px; }
  #reminderBanner{ display:none; }

  .sync-badge{ display:inline-block; font-size:10.5px; font-weight:800; letter-spacing:.03em; padding:4px 9px; border-radius:99px; margin-top:6px; }
  .sync-badge.syncing{ background:var(--amber-soft); color:var(--amber); }
  .sync-badge.synced{ background:var(--success-soft); color:var(--success); }
  .sync-badge.offline{ background:var(--pending-track); color:var(--ink-soft); }
  .sync-badge:empty{ display:none; }
</style>
</head>
<body>
<div class="wrap" id="app"></div>

<nav class="bottom-nav">
  <div class="nav-item" data-tab="today" id="nav-today">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 01-2 2H5a2 2 0 01-2-2V5a2 2 0 012-2h11"/></svg>
    <span data-t="todayTab">Today</span>
  </div>
  <div class="nav-item" data-tab="history" id="nav-history">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 3"/></svg>
    <span data-t="historyTab">History</span>
  </div>
  <div class="nav-item" data-tab="settings" id="nav-settings">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 00.33 1.82l.06.06a2 2 0 11-2.83 2.83l-.06-.06a1.65 1.65 0 00-1.82-.33 1.65 1.65 0 00-1 1.51V21a2 2 0 01-4 0v-.09A1.65 1.65 0 009 19.4a1.65 1.65 0 00-1.82.33l-.06.06a2 2 0 11-2.83-2.83l.06-.06A1.65 1.65 0 004.6 15a1.65 1.65 0 00-1.51-1H3a2 2 0 010-4h.09A1.65 1.65 0 004.6 9a1.65 1.65 0 00-.33-1.82l-.06-.06a2 2 0 112.83-2.83l.06.06A1.65 1.65 0 009 4.6a1.65 1.65 0 001-1.51V3a2 2 0 014 0v.09a1.65 1.65 0 001 1.51 1.65 1.65 0 001.82-.33l.06-.06a2 2 0 112.83 2.83l-.06.06A1.65 1.65 0 0019.4 9a1.65 1.65 0 001.51 1H21a2 2 0 010 4h-.09a1.65 1.65 0 00-1.51 1z"/></svg>
    <span data-t="settingsTab">Settings</span>
  </div>
</nav>

<script>
/* ============ CONFIG ============ */
const STORAGE_KEY = 'eyeDropTracker.doses.v3';
const SETTINGS_KEY = 'eyeDropTracker.settings.v1';
const PREF_KEY = 'eyeDropTracker.prefs.v2';

const MEDS = [
 { key:'maxmoist', name:'MAXMOIST', nameMr:'मॅक्समॉइस्ट',
    subEn:'Sodium Hyaluronate Eye Drops 0.1% w/v', subMr:'सोडियम हायलुरोनेट डोळ्याचे थेंब ०.१% w/v',
    duration:30, taper:false, freqOf:()=>4, defaultTimes:['07:00','12:00','17:00','22:00'] },
 { key:'predforte', name:'PRED FORTE', nameMr:'प्रेड फोर्ट',
    subEn:'Prednisolone Acetate Ophthalmic Suspension', subMr:'प्रेडनिसोलोन एसीटेट नेत्र सस्पेंशन',
    duration:28, taper:true,
    freqOf:(day)=>{ if(day<1) return 0; if(day<=7) return 4; if(day<=14) return 3; if(day<=21) return 2; if(day<=28) return 1; return 0; },
    defaultTimes:['07:00','12:00','17:00','22:00'] },
  { key:'vigat', name:'VIGAT HS', nameMr:'विगाट एचएस',
    subEn:'Gatifloxacin Ophthalmic Solution 0.5% w/v', subMr:'गॅटिफ्लॉक्सासिन नेत्र द्रावण ०.५% w/v',
    duration:14, taper:false, freqOf:()=>2, defaultTimes:['08:00','20:00'] },
  { key:'micronac', name:'MICRONAC PF', nameMr:'मायक्रोनॅक पीएफ',
    subEn:'Nepafenac Ophthalmic Suspension', subMr:'नेपाफेनॅक नेत्र सस्पेंशन',
    duration:45, taper:false, freqOf:()=>2, defaultTimes:['08:00','20:00'] }
const TAPER_STAGES = [
  {fromDay:1, toDay:7, freq:4}, {fromDay:8, toDay:14, freq:3},
  {fromDay:15, toDay:21, freq:2}, {fromDay:22, toDay:28, freq:1}
];
const TOTAL_DAYS = Math.max(...MEDS.map(m=>m.duration)); // 45

const EYES = [
  { key:'R', labelKey:'rightEye', start:new Date(2026,7,27), color:'var(--accent-blue)' },  // 27 Aug 2026 = Day 1
  { key:'L', labelKey:'leftEye',  start:new Date(2026,7,31), color:'var(--accent)' }          // 31 Aug 2026 = Day 1
];

/* ============ I18N ============ */

    treatmentNotStarted:'Treatment for this eye has not started yet.',
    treatmentComplete:'Treatment complete for this eye \u2014 no drops scheduled today.',
    noHistory:'No previous days yet.',
    doseTimes:'Dose Times', doseTimesNote:'These clock times apply to both eyes\u2019 doses (same medicines, same schedule, given back-to-back). Only the given/pending status is tracked separately per eye.',
    slot:'Slot', selectedDateLabel:'SELECTED DATE', jumpToday:'Jump to today', lang:'मराठी',
    nextDose:'Next Dose', medicine:'Medicine', eyeLabel:'Eye', timeLabel:'Time', allComplete:'\u2713 All doses complete',
    allFilter:'All',
    reminders:'Reminders', reminderNote:'Plays a sound and shows an alert naming the exact eye and medicine when a dose time arrives \u2014 works while this page/tab is open (add it to your phone\u2019s Home Screen and keep it open for best results). It cannot alert you if the browser is fully closed.',
    remindersOn:'Reminders are on', remindersOff:'Reminders are off', turnOn:'Turn on', turnOff:'Turn off',
    notifBlocked:'Notifications are blocked for this site in your browser/phone settings \u2014 you\u2019ll still get the in-app banner and sound while the app is open.',

    syncing:'Syncing\u2026', synced:'Synced with family', offline:'Offline \u2014 saved on this phone only',

  },

    postOpDay:'शस्त्रक्रियेनंतरचा दिवस', dayShort:'दिवस', of:'पैकी',
    overallProgress:'आजची एकूण प्रगती', todaysDoses:'आजची प्रगती',
    given:'दिले', dose:'डोस', give:'द्या', givenAtPrefix:'दिले -',
    predForteTaper:'प्रेड फोर्ट टेपर', current:'सध्या', timesPerDay:'वेळा/दिवस', timePerDay:'वेळ/दिवस', days:'दिवस',
    todayTab:'आज', historyTab:'इतिहास', settingsTab:'सेटिंग्ज',
    treatmentNotStarted:'या डोळ्यासाठी उपचार अद्याप सुरू झालेला नाही.',

/* ============ STATE ============ */
let lang = localStorage.getItem(PREF_KEY+'.lang') || 'en';
let theme = localStorage.getItem(PREF_KEY+'.theme') || 'light';
let remindersEnabled = localStorage.getItem(PREF_KEY+'.reminders') === '1';
let notifPermission = (typeof Notification !== 'undefined') ? Notification.permission : 'unsupported';
let activeTab = 'today';
let historyFilter = 'ALL';
let selectedEye = localStorage.getItem(PREF_KEY+'.eye') || 'R';
let selectedDate = null;
let syncStatus = 'idle'; // 'idle' | 'syncing' | 'synced' | 'offline'

function t(key){ return STR[lang][key]; }
function loadDoses(){ try{ return JSON.parse(localStorage.getItem(STORAGE_KEY)) || {}; }catch(e){ return {}; } }
function saveDoses(d){ localStorage.setItem(STORAGE_KEY, JSON.stringify(d)); }
function loadSettings(){ try{ const s=JSON.parse(localStorage.getItem(SETTINGS_KEY)); if(s) return s; }catch(e){} const def={}; MEDS.forEach(m=>def[m.key]=m.defaultTimes.slice()); return def; }
function saveSettings(s){ localStorage.setItem(SETTINGS_KEY, JSON.stringify(s)); }

let doseData = loadDoses();
let settings = loadSettings();

/* ============ DATE HELPERS ============ */
function startOfDayLocal(d){ return new Date(d.getFullYear(), d.getMonth(), d.getDate()); }
function daysBetween(a,b){ return Math.round((startOfDayLocal(b)-startOfDayLocal(a))/86400000); }
function dateKey(d){ const y=d.getFullYear(), m=String(d.getMonth()+1).padStart(2,'0'), day=String(d.getDate()).padStart(2,'0'); return `${y}-${m}-${day}`; }
function addDays(d,n){ const r=new Date(d); r.setDate(r.getDate()+n); return r; }
function parseDateKey(s){ const [y,m,d]=s.split('-').map(Number); return new Date(y,m-1,d); }
function isSameDay(a,b){ return dateKey(a)===dateKey(b); }
function eyeDay(eye, date){ return daysBetween(eye.start, date) + 1; }
selectedDate = startOfDayLocal(new Date());

const MONTHS_EN=['January','February','March','April','May','June','July','August','September','October','November','December'];
const MONTHS_MR=['जानेवारी','फेब्रुवारी','मार्च','एप्रिल','मे','जून','जुलै','ऑगस्ट','सप्टेंबर','ऑक्टोबर','नोव्हेंबर','डिसेंबर'];
const WD_EN=['SUNDAY','MONDAY','TUESDAY','WEDNESDAY','THURSDAY','FRIDAY','SATURDAY'];
const WD_MR=['रविवार','सोमवार','मंगळवार','बुधवार','गुरुवार','शुक्रवार','शनिवार'];
const DIGITS_MR=['०','१','२','३','४','५','६','७','८','९'];
function toMrNum(n){ return String(n).split('').map(c=>/[0-9]/.test(c)?DIGITS_MR[+c]:c).join(''); }
function num(n){ return lang==='mr'? toMrNum(n) : n; }
function formatDate(d){ const day=d.getDate(), month=lang==='mr'?MONTHS_MR[d.getMonth()]:MONTHS_EN[d.getMonth()], year=d.getFullYear(); return `${num(day)} ${month} ${num(year)}`; }
function formatDateShort(d){ const day=d.getDate(), month=lang==='mr'?MONTHS_MR[d.getMonth()].slice(0,3):MONTHS_EN[d.getMonth()].slice(0,3); return `${num(day)} ${month}`; }
function weekdayName(d){ return lang==='mr'? WD_MR[d.getDay()] : WD_EN[d.getDay()]; }
function formatHM(d){ return `${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`; }
function formatTimeDisplay(hm){ const [h,m]=hm.split(':').map(Number); const ap=h>=12?'PM':'AM'; let hh=h%12; if(hh===0)hh=12; return `${num(hh)}:${num(String(m).padStart(2,'0'))} ${ap}`; }
function formatTimeNow(){ return formatTimeDisplay(formatHM(new Date())); }

/* ============ MED / DOSE LOGIC ============ */
function medFreqOnDay(med, day){ return med.freqOf(day); }
function isMedActive(med, day){ if(day<1) return false; if(day>med.duration) return false; return medFreqOnDay(med,day) > 0; }
function timesForMed(med, freq){ const times = settings[med.key] && settings[med.key].length ? settings[med.key] : med.defaultTimes; return times.slice(0, freq); }
function medDisplayName(m){ if(lang==='mr' && m.nameMr) return `${m.nameMr} <span style="opacity:.65;font-weight:600;font-size:0.75em;">(${m.name})</span>`; return m.name; }
function currentTaperStage(day){ return TAPER_STAGES.find(s=>day>=s.fromDay && day<=s.toDay) || null; }

function getDose(dk, eyeKey, medKey, idx){
  return (doseData[dk] && doseData[dk][eyeKey] && doseData[dk][eyeKey][medKey] && doseData[dk][eyeKey][medKey][idx]) || null;
}
function setDoseGiven(dk, eyeKey, medKey, idx, val){
  if(!doseData[dk]) doseData[dk] = {};
  if(!doseData[dk][eyeKey]) doseData[dk][eyeKey] = {};
  if(!doseData[dk][eyeKey][medKey]) doseData[dk][eyeKey][medKey] = [];
  doseData[dk][eyeKey][medKey][idx] = val ? { g:true, t: formatTimeNow() } : { g:false };
  saveDoses(doseData);
  schedulePush();
}

/* ============ MULTI-DEVICE SYNC (Vercel KV via /api/doses) ============ */
let pushTimer = null;
function schedulePush(){
  clearTimeout(pushTimer);
  pushTimer = setTimeout(pushServerData, 400);
}
async function pushServerData(){
  syncStatus = 'syncing'; updateSyncBadge();
  try{
    const res = await fetch('/api/doses', {
      method:'POST',
      headers:{ 'Content-Type':'application/json' },
      body: JSON.stringify({ doses: doseData, settings })
    });
    if(!res.ok) throw new Error('bad status');
    syncStatus = 'synced';
  }catch(e){
    syncStatus = 'offline';
  }
  updateSyncBadge();
}
async function fetchServerData(showSyncing){
  if(showSyncing){ syncStatus='syncing'; updateSyncBadge(); }
  try{
    const res = await fetch('/api/doses', { cache:'no-store' });
    if(!res.ok) throw new Error('bad status');
    const data = await res.json();
    if(data && data.doses){ doseData = data.doses; saveDoses(doseData); }
    if(data && data.settings){ settings = data.settings; saveSettings(settings); }
    syncStatus = 'synced';
  }catch(e){
    syncStatus = 'offline';
  }
  render();
}
function updateSyncBadge(){
  const el = document.getElementById('syncBadge');
  if(!el) return;
  const map = { idle:'', syncing:t('syncing'), synced:t('synced'), offline:t('offline') };
  el.textContent = map[syncStatus] || '';
  el.className = 'sync-badge ' + syncStatus;
}

function computeEyeStats(eye, date){
  const day = eyeDay(eye, date);
  const dk = dateKey(date);
  const activeMeds = MEDS.filter(m=>isMedActive(m, day));
  let total=0, given=0;
  activeMeds.forEach(m=>{
    const freq = medFreqOnDay(m, day);
    total += freq;
    for(let i=0;i<freq;i++){ const rec = getDose(dk, eye.key, m.key, i); if(rec && rec.g) given++; }
  });
  return { day, dk, activeMeds, total, given };
}

function computeNextDose(){
  const now = new Date();
  const dk = dateKey(now);
  const nowHM = formatHM(now);
  let candidates = [];
  EYES.forEach(eye=>{
    const day = eyeDay(eye, now);
    MEDS.filter(m=>isMedActive(m, day)).forEach(m=>{
      const freq = medFreqOnDay(m, day);
      const times = timesForMed(m, freq);
      for(let i=0;i<freq;i++){
        const rec = getDose(dk, eye.key, m.key, i);
        if(rec && rec.g) continue;
        candidates.push({ eye, med:m, time24: times[i] || '00:00' });
      }
    });
  });
  if(candidates.length===0) return null;
  candidates.sort((a,b)=>a.time24.localeCompare(b.time24));
  const chosen = candidates.find(c=>c.time24 >= nowHM) || candidates[0];
  return { medName: chosen.med.name, eyeLabelKey: chosen.eye.labelKey, color: chosen.eye.color, time: formatTimeDisplay(chosen.time24) };
}

/* ============ SVG ICONS ============ */
const CHECK_SVG = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>';
const SUN_SVG = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>';

/* ============ REMINDERS ============ */
const firedReminders = new Set();
function playChime(){
  try{
    const ctx = new (window.AudioContext||window.webkitAudioContext)();
    [880,1108].forEach((freq,i)=>{
      setTimeout(()=>{
        const o=ctx.createOscillator(), g=ctx.createGain();
        o.type='sine'; o.frequency.value=freq;
        g.gain.setValueAtTime(0.0001, ctx.currentTime);
        g.gain.exponentialRampToValueAtTime(0.35, ctx.currentTime+0.02);
        g.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime+0.55);
        o.connect(g); g.connect(ctx.destination); o.start(); o.stop(ctx.currentTime+0.6);
      }, i*260);
    });
  }catch(e){}
}
let bannerTimeout=null;
function showBanner(title, body){
  let el = document.getElementById('reminderBanner');
  if(!el){
    el = document.createElement('div'); el.id='reminderBanner';
    el.style.cssText='position:fixed;top:14px;left:14px;right:14px;max-width:508px;margin:0 auto;background:var(--navy);color:var(--navy-ink);padding:14px 16px;border-radius:16px;box-shadow:0 10px 28px rgba(0,0,0,0.3);z-index:50;font-family:Inter,sans-serif;cursor:pointer;white-space:pre-line;';
    el.onclick = ()=>{ el.style.display='none'; };
    document.body.appendChild(el);
  }
  el.innerHTML = `<div style="font-weight:800;font-size:13px;margin-bottom:4px;">${title}</div><div style="font-size:12.5px;opacity:.92;">${body}</div>`;
  el.style.display='block';
  clearTimeout(bannerTimeout); bannerTimeout = setTimeout(()=>{ el.style.display='none'; }, 12000);
}
function fireReminder(title, body){
  if(notifPermission==='granted'){ try{ new Notification(title, {body, tag: title+body}); }catch(e){} }
  playChime(); showBanner(title, body);
}
function checkReminders(){
  if(!remindersEnabled) return;
  const now = new Date();
  const nowHM = formatHM(now);
  const dk = dateKey(now);
  EYES.forEach(eye=>{
    const day = eyeDay(eye, now);
    MEDS.filter(m=>isMedActive(m, day)).forEach(m=>{
      const freq = medFreqOnDay(m, day);
      const times = timesForMed(m, freq);
      times.forEach((tm, idx)=>{
        if(tm !== nowHM) return;
        const fireKey = `${dk}_${eye.key}_${m.key}_${idx}`;
        if(firedReminders.has(fireKey)) return;
        firedReminders.add(fireKey);
        const rec = getDose(dk, eye.key, m.key, idx);
        if(rec && rec.g) return;
        fireReminder(t('patientName'), `${t(eye.labelKey)}\n${m.name}\n${t('doseDueNow').replace('{n}', num(idx+1))}`);
      });
    });
  });
}
setInterval(checkReminders, 20000);
function setReminders(val){
  remindersEnabled = val;
  localStorage.setItem(PREF_KEY+'.reminders', val?'1':'0');
  if(val && typeof Notification !== 'undefined' && Notification.permission==='default'){
    Notification.requestPermission().then(p=>{ notifPermission=p; render(); });
  } else render();
}

/* ============ RENDER: EYE SECTION ============ */
function renderEyeSection(eye, date, stats){
  const pct = stats.total>0 ? Math.round((stats.given/stats.total)*100) : 0;
  let body = '';
  if(stats.day < 1){
    body = `<div class="all-done">${t('treatmentNotStarted')}</div>`;
  } else if(stats.activeMeds.length === 0){
    body = `<div class="all-done">${t('treatmentComplete')}</div>`;
  } else {
    body = stats.activeMeds.map(m=>{
      const freq = medFreqOnDay(m, stats.day);
      const times = timesForMed(m, freq);
      const sub = lang==='mr'? m.subMr : m.subEn;
      let lines = '';
      for(let i=0;i<freq;i++){
        const time = times[i] || '';
        const rec = getDose(stats.dk, eye.key, m.key, i);
        const isGiven = !!(rec && rec.g);
        lines += `
          <div class="dose-line">
            <div class="dose-line-top">
              <div class="dose-line-info">
                <div class="lbl">${t('dose')} ${num(i+1)}</div>
                ${time?`<div class="time">${formatTimeDisplay(time)}</div>`:''}
              </div>
              <div class="give-btn ${isGiven?'given':''}" data-eye="${eye.key}" data-med="${m.key}" data-idx="${i}">
                ${isGiven?`<span class="gicon">${CHECK_SVG}</span><span>${t('given')}</span>`:`<span>${t('give')}</span>`}
              </div>
            </div>
            ${isGiven?`<div class="given-at">${t('givenAtPrefix')} ${rec.t}</div>`:''}
          </div>`;
      }
      return `
        <div class="med-card" style="--eye-color:${eye.color}">
          <div class="med-head">
            <div>
              <div class="med-name display">${medDisplayName(m)}</div>
              <div class="med-sub">${sub}</div>
            </div>
            <div class="med-freq-chip">${num(freq)}&times;</div>
          </div>
          ${lines}
        </div>`;
    }).join('');
  }

  let taperHtml = '';
  const pf = MEDS.find(m=>m.key==='predforte');
  if(isMedActive(pf, stats.day)){
    const stage = currentTaperStage(stats.day);
    taperHtml = `
      <div class="taper-card">
        <div class="taper-title">${t('predForteTaper')}</div>
        <div class="taper-current">${t('current')}: <span>${num(stage.freq)} ${stage.freq===1?t('timePerDay'):t('timesPerDay')}</span></div>
        <div class="taper-stages">
          ${TAPER_STAGES.map(s=>{
            const cls = s===stage ? 'current' : (stats.day>s.toDay ? 'past' : '');
            return `<div class="stage ${cls}"><div class="days">${t('days')} ${num(s.fromDay)}\u2013${num(s.toDay)}</div><div class="freq">${num(s.freq)}&times;</div></div>`;
          }).join('')}
        </div>
      </div>`;
  }

  return `
    <div class="eye-section" style="--eye-color:${eye.color}">
      <div class="eye-header">
        <div class="eye-header-top">
          <span class="eye-emoji">\uD83D\uDC41\uFE0F</span>
          <div>
            <div class="eye-title">${t(eye.labelKey)}</div>
            <div class="eye-day">${t('postOpDay')} ${num(Math.max(stats.day,0))}</div>
          </div>
        </div>
        <div class="eye-dayof">${t('dayShort')} ${num(Math.max(stats.day,0))} ${t('of')} ${num(TOTAL_DAYS)}</div>
      </div>
      <div class="eye-progress">
        <div class="eye-progress-label">${t('todaysDoses')}</div>
        <div class="eye-progress-num">${num(stats.given)} / ${num(stats.total)} ${t('given')}</div>
        <div class="bar-track"><div class="bar-fill" style="width:${pct}%"></div></div>
      </div>
      ${taperHtml}
      ${body}
    </div>`;
}

/* ============ RENDER: TODAY ============ */
function renderToday(){
  const viewDate = selectedDate;
  const isToday = isSameDay(viewDate, new Date());
  const statsR = computeEyeStats(EYES[0], viewDate);
  const statsL = computeEyeStats(EYES[1], viewDate);
  const overallTotal = statsR.total + statsL.total;
  const overallGiven = statsR.given + statsL.given;
  const overallPct = overallTotal ? Math.round((overallGiven/overallTotal)*100) : 0;
  const nextDose = isToday ? computeNextDose() : null;

  const nextDoseHtml = isToday ? `
    <div class="next-dose-card">
      <div class="next-dose-label">${t('nextDose')}</div>
      ${nextDose ? `
        <div class="nd-row"><span>${t('medicine')}</span><b>${nextDose.medName}</b></div>
        <div class="nd-row"><span>${t('eyeLabel')}</span><b style="color:${nextDose.color}">${t(nextDose.eyeLabelKey)}</b></div>
        <div class="nd-row"><span>${t('timeLabel')}</span><b>${nextDose.time}</b></div>
      ` : `<div class="next-dose-complete">${t('allComplete')}</div>`}
    </div>` : '';

  return `
    <div class="date-nav">
      <div class="date-arrow-btn" id="prevDay">&#8249;</div>
      <div class="date-center">
        <div class="lbl">${isToday ? t('dayShort') : t('selectedDateLabel')}</div>
        <div class="val display">${formatDate(viewDate)} \u00b7 ${weekdayName(viewDate)}</div>
        <input type="date" id="dateInput" value="${dateKey(viewDate)}">
      </div>
      <div class="date-arrow-btn" id="nextDay">&#8250;</div>
    </div>
    ${!isToday ? `<div class="today-chip-btn" id="jumpToday">${t('jumpToday')}</div>` : ''}
    ${nextDoseHtml}
    <div class="overall-card">
      <div class="overall-label">${t('overallProgress')}</div>
      <div class="overall-num">${num(overallGiven)} / ${num(overallTotal)} ${t('given')}</div>
      <div class="bar-track"><div class="bar-fill" style="width:${overallPct}%"></div></div>
    </div>
    <div class="hist-filter-tabs">
      <div class="hf-tab ${selectedEye==='R'?'active':''}" data-eye="R" style="--eye-color:var(--accent-blue)">\uD83D\uDC41\uFE0F ${t('rightEyeTab')}</div>
      <div class="hf-tab ${selectedEye==='L'?'active':''}" data-eye="L" style="--eye-color:var(--accent)">\uD83D\uDC41\uFE0F ${t('leftEyeTab')}</div>
    </div>
    ${selectedEye==='R' ? renderEyeSection(EYES[0], viewDate, statsR) : renderEyeSection(EYES[1], viewDate, statsL)}
    <div class="patient-tag">${t('patientName')}</div>
  `;
}

/* ============ RENDER: HISTORY ============ */
function renderHistory(){
  const today = startOfDayLocal(new Date());
  const earliestStart = EYES.reduce((min,e)=> e.start<min?e.start:min, EYES[0].start);
  const filterTabsHtml = `
    <div class="hist-filter-tabs">
      <div class="hf-tab ${historyFilter==='ALL'?'active':''}" data-f="ALL">${t('allFilter')}</div>
      <div class="hf-tab ${historyFilter==='R'?'active':''}" data-f="R" style="--eye-color:var(--accent-blue)">${t('rightEye')}</div>
      <div class="hf-tab ${historyFilter==='L'?'active':''}" data-f="L" style="--eye-color:var(--accent)">${t('leftEye')}</div>
    </div>`;

  let html = '';
  for(let date = addDays(today,-1); date >= earliestStart; date = addDays(date,-1)){
    const dk = dateKey(date);
    const eyesToShow = EYES.filter(e => historyFilter==='ALL' || historyFilter===e.key);
    let blocks = '';
    eyesToShow.forEach(eye=>{
      const day = eyeDay(eye, date);
      const activeMeds = MEDS.filter(m=>isMedActive(m, day));
      if(activeMeds.length===0) return;
      const rows = activeMeds.map(m=>{
        const freq = medFreqOnDay(m, day);
        let given = 0;
        for(let i=0;i<freq;i++){ const rec = getDose(dk, eye.key, m.key, i); if(rec && rec.g) given++; }
        const complete = given===freq;
        return `<div class="hist-row"><b>${medDisplayName(m)}</b><span class="${complete?'ok':'warn'}">${num(given)}/${num(freq)}</span></div>`;
      }).join('');
      blocks += `<div class="hist-eye-block" style="--eye-color:${eye.color}"><div class="hist-eye-label">${t(eye.labelKey)}</div>${rows}</div>`;
    });
    if(!blocks) continue;
    html += `<div class="hist-card"><div class="hist-date display">${formatDateShort(date)}</div>${blocks}</div>`;
  }
  if(!html) html = `<div class="empty-state">${t('noHistory')}</div>`;
  return filterTabsHtml + html;
}

/* ============ RENDER: SETTINGS ============ */
function renderReminderCard(){
  const supported = typeof Notification !== 'undefined';
  return `
    <div class="settings-card">
      <div class="med-name display">${t('reminders')}</div>
      <div class="settings-note">${t('reminderNote')}</div>
      <div class="time-row" style="border-top:none;">
        <label>${remindersEnabled? t('remindersOn') : t('remindersOff')}</label>
        <div class="today-chip-btn" id="reminderToggleBtn" style="margin:0;">${remindersEnabled? t('turnOff') : t('turnOn')}</div>
      </div>
      ${supported && notifPermission==='denied' ? `<div class="settings-note" style="color:var(--danger);">${t('notifBlocked')}</div>` : ''}
      <div class="today-chip-btn" id="testReminderBtn" style="margin-top:4px;background:var(--pending-track);color:var(--ink);">${t('testReminder')}</div>
    </div>`;
}
function renderSettings(){
  const cards = MEDS.map(m=>{
    const times = settings[m.key] && settings[m.key].length===m.defaultTimes.length ? settings[m.key] : m.defaultTimes.slice();
    const rows = times.map((tm,i)=>`
      <div class="time-row">
        <label>${t('slot')} ${num(i+1)}</label>
        <input type="time" value="${tm}" data-med="${m.key}" data-idx="${i}" class="time-input">
      </div>`).join('');
    return `<div class="settings-card"><div class="med-name display">${medDisplayName(m)}</div>${rows}</div>`;
  }).join('');
  return `
    ${renderReminderCard()}
    <div class="section-title">${t('doseTimes')}</div>
    <div class="settings-note">${t('doseTimesNote')}</div>
    ${cards}
    <div class="section-title">${t('aboutData')}</div>
    <div class="settings-card"><div class="settings-note" style="margin-bottom:0;">${t('aboutDataNote')}</div></div>
  `;
}

/* ============ MAIN RENDER ============ */
function render(){
  document.body.setAttribute('data-theme', theme);
  document.body.classList.toggle('mr', lang==='mr');
  document.documentElement.setAttribute('lang', lang);

  let content = '';
  if(activeTab==='today') content = renderToday();
  else if(activeTab==='history') content = renderHistory();
  else content = renderSettings();

  document.getElementById('app').innerHTML = `
    <div class="topbar">
      <div>
        <div class="brand-name display">${t('patientName')}</div>
        <div class="brand-title display">${t('appTitle')}</div>
        <div class="sync-badge ${syncStatus}" id="syncBadge">${ {idle:'',syncing:t('syncing'),synced:t('synced'),offline:t('offline')}[syncStatus] || '' }</div>
      </div>
      <div class="icon-row">
        <div class="icon-btn ${remindersEnabled?'on':''}" id="bellToggle">${BELL_SVG}</div>
        <div class="icon-btn lang-btn" id="langToggle">${t('lang')}</div>
        <div class="icon-btn" id="themeToggle">${theme==='light'?MOON_SVG:SUN_SVG}</div>
      </div>
    </div>
    <div class="tabs">
      <div class="tab ${activeTab==='today'?'active':''}" data-tab="today">${t('todayTab')}</div>
      <div class="tab ${activeTab==='history'?'active':''}" data-tab="history">${t('historyTab')}</div>
      <div class="tab ${activeTab==='settings'?'active':''}" data-tab="settings">${t('settingsTab')}</div>
    </div>
    ${content}
  `;
  attachHandlers();
  updateBottomNav();
}
function updateBottomNav(){
  ['today','history','settings'].forEach(k=> document.getElementById('nav-'+k).classList.toggle('active', activeTab===k));
}
function attachHandlers(){
  document.getElementById('langToggle').onclick = ()=>{ lang = lang==='en'?'mr':'en'; localStorage.setItem(PREF_KEY+'.lang', lang); render(); };
  document.getElementById('themeToggle').onclick = ()=>{ theme = theme==='light'?'dark':'light'; localStorage.setItem(PREF_KEY+'.theme', theme); render(); };
  document.getElementById('bellToggle').onclick = ()=> setReminders(!remindersEnabled);
  document.querySelectorAll('.tab').forEach(el=> el.onclick = ()=>{ activeTab = el.dataset.tab; render(); });
  document.querySelectorAll('.nav-item').forEach(el=> el.onclick = ()=>{ activeTab = el.dataset.tab; render(); });

  document.querySelectorAll('.give-btn').forEach(el=>{
    el.onclick = ()=>{
      const eyeKey = el.dataset.eye, medKey = el.dataset.med, idx = +el.dataset.idx;
      const dk = dateKey(selectedDate);
      const rec = getDose(dk, eyeKey, medKey, idx);
      setDoseGiven(dk, eyeKey, medKey, idx, !(rec && rec.g));
      render();
    };
  });

  const prevBtn = document.getElementById('prevDay'); if(prevBtn) prevBtn.onclick = ()=>{ selectedDate = addDays(selectedDate,-1); render(); };
  const nextBtn = document.getElementById('nextDay'); if(nextBtn) nextBtn.onclick = ()=>{ selectedDate = addDays(selectedDate,1); render(); };
  const dateInput = document.getElementById('dateInput'); if(dateInput) dateInput.onchange = ()=>{ if(dateInput.value){ selectedDate = parseDateKey(dateInput.value); render(); } };
  const jumpBtn = document.getElementById('jumpToday'); if(jumpBtn) jumpBtn.onclick = ()=>{ selectedDate = startOfDayLocal(new Date()); render(); };

  document.querySelectorAll('.hf-tab').forEach(el=>{
    el.onclick = ()=>{
      if(el.dataset.eye !== undefined){ selectedEye = el.dataset.eye; localStorage.setItem(PREF_KEY+'.eye', selectedEye); }
      else if(el.dataset.f !== undefined){ historyFilter = el.dataset.f; }
      render();
    };
  });

  document.querySelectorAll('.time-input').forEach(el=>{
    el.onchange = ()=>{
      const medKey = el.dataset.med, idx = +el.dataset.idx;
      const med = MEDS.find(m=>m.key===medKey);
      if(!settings[medKey] || settings[medKey].length!==med.defaultTimes.length) settings[medKey] = med.defaultTimes.slice();
      settings[medKey][idx] = el.value;
      saveSettings(settings);
      schedulePush();
    };
  });

  const reminderToggleBtn = document.getElementById('reminderToggleBtn'); if(reminderToggleBtn) reminderToggleBtn.onclick = ()=> setReminders(!remindersEnabled);
  const testReminderBtn = document.getElementById('testReminderBtn'); if(testReminderBtn) testReminderBtn.onclick = ()=> fireReminder(t('patientName'), `${t('rightEye')}\nMAXMOIST\n${t('doseDueNow').replace('{n}', num(1))}`);
}

render();
fetchServerData(true);
setInterval(()=> fetchServerData(false), 12000);
document.addEventListener('visibilitychange', ()=>{ if(!document.hidden) fetchServerData(true); });
</script>
</body>
